<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagwerk · Baustelle</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1c1f24; --muted: #6b7280; --line: #e6e8ec;
    --accent: #2457c5; --green: #2e9d5b; --amber: #e0a020; --red: #d0453a; --grey: #d5d8de; --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); padding-bottom: 110px; }
  header { padding: 16px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
           display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 19px; margin: 0; }
  header .date { color: var(--muted); }
  header a { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 15px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  @media (min-width: 900px) { main { grid-template-columns: 1fr 1fr; } }
  .act { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .act h2 { font-size: 17px; margin: 0; }
  .act .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .bar { height: 8px; background: #eef0f3; border-radius: 4px; margin: 10px 0 12px; position: relative; overflow: hidden; }
  .bar div { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .chip { min-height: 52px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fafbfc;
          font: inherit; text-align: left; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; justify-content: center; }
  .chip b { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; hyphens: auto; }
  .chip span { font-size: 13px; color: var(--muted); }
  .chip.s-0 { border-left: 5px solid var(--grey); } .chip.s-mid { border-left: 5px solid var(--amber); } .chip.s-done { border-left: 5px solid var(--green); }
  .chip:active { transform: scale(.98); }
  .empty { color: var(--muted); }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; }
  .btn { font: inherit; font-weight: 600; font-size: 17px; border: 0; border-radius: 12px; padding: 16px 22px; min-height: 56px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; width: 100%; max-width: 520px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(20, 22, 26, .35); display: none; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
           max-width: 560px; margin: 0 auto; z-index: 11; transform: translateY(105%); visibility: hidden; transition: transform .18s ease-out, visibility 0s .18s; max-height: 85vh; overflow: auto; }
  .sheet.open { transform: none; visibility: visible; transition: transform .18s ease-out; }
  .sheet h3 { margin: 0 0 4px; font-size: 18px; }
  .sheet .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .state { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 56px; margin-bottom: 8px; padding: 0 16px;
           border: 1px solid var(--line); border-radius: 12px; background: #fafbfc; font: inherit; font-size: 17px; cursor: pointer; color: var(--ink); }
  .state.reached { color: var(--muted); }
  .state.current { border-color: var(--green); background: #e8f5ee; color: #1e6b3e; font-weight: 600; }
  .state:disabled { opacity: .5; cursor: wait; }
  .sheet .cancel { width: 100%; background: #eef0f3; color: var(--ink); margin-top: 4px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #1c1f24; color: #fff; padding: 12px 18px;
           border-radius: 12px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; } .toast.err { background: var(--red); }
</style>
</head>
<body>
<header>
  <h1>Heute auf der Baustelle</h1>
  <span class="date" id="date">–</span>
  <a href="/upload">+ Aufnahme</a>
</header>
<main id="acts"><p class="empty">Lade…</p></main>
<div class="footer"><button class="btn primary" id="release">Tagesbericht freigeben</button></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h3 id="sheetTitle"></h3>
  <div class="meta" id="sheetMeta"></div>
  <div id="states"></div>
  <button class="btn cancel" id="sheetClose">Abbrechen</button>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k === 'style') el.style.cssText = v; else if (k.startsWith('on')) el[k] = v; else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const dmy = s => { if (!s) return '–'; const [y, m, d] = s.slice(0, 10).split('-'); return `${d}.${m}.${y}`; };
const STATE_DE = { removed: 'demontiert', substructure: 'Unterkonstruktion', installed: 'montiert', checked: 'abgenommen',
  prepared: 'vorbereitet', primed: 'grundiert', painted: 'gestrichen', done: 'fertig', framed: 'Rahmen', boarded: 'beplankt',
  finished: 'fertig', mounted: 'montiert', wired: 'verkabelt', tested: 'geprüft', connected: 'angeschlossen',
  commissioned: 'in Betrieb', stripped: 'entfernt', levelled: 'nivelliert', covered: 'belegt' };
const de = s => s ? (STATE_DE[s] || s) : 'nicht begonnen';
const pct = v => (+(v || 0)).toLocaleString('de-DE', { maximumFractionDigits: 0 }) + '\u00a0%';

let toastTimer;
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast' + (err ? ' err' : ''), 2800);
}

let elements = {};
function render(d) {
  $('date').textContent = dmy(d.date);
  elements = {};
  (d.zones || []).forEach(z => (z.elements || []).forEach(e => elements[e.id] = { ...e, zone: z.name }));
  const acts = (d.activities || []).filter(a => (a.pct ?? 0) < 100 && a.planned_start && a.planned_start <= d.date);
  if (!acts.length) { $('acts').replaceChildren(h('p', { class: 'empty' }, 'Heute keine offenen Vorgänge. No open activities today.')); return; }
  $('acts').replaceChildren(...acts.map(a => h('div', { class: 'act' },
    h('h2', {}, a.name),
    h('div', { class: 'meta' }, `${a.trade || '–'} · ${pct(a.pct)} von Soll ${pct(a.planned_pct)}`),
    h('div', { class: 'bar' }, h('div', { style: `width:${Math.min(100, a.pct || 0)}%` })),
    chipsFor(a))));
}
function chipsFor(a) {
  const els = (a.elements || []).map(id => elements[id]).filter(Boolean);
  if (!els.length) return h('p', { class: 'empty', style: 'margin:0;font-size:14px' }, 'Keine Elemente verknüpft.');
  return h('div', { class: 'chips' }, els.map(e => {
    const cls = !e.pct ? 's-0' : e.pct >= 100 ? 's-done' : 's-mid';
    return h('button', { class: 'chip ' + cls, onclick: () => openSheet(e.id) }, h('b', {}, e.name), h('span', {}, `${de(e.state)} · ${pct(e.pct)}`));
  }));
}

function openSheet(id) {
  const e = elements[id]; if (!e) return;
  $('sheetTitle').textContent = e.name;
  $('sheetMeta').textContent = `${e.zone || ''} · aktuell: ${de(e.state)} (${pct(e.pct)})`;
  const states = e.states || [], cur = states.indexOf(e.state);
  $('states').replaceChildren(...(states.length ? states.map((s, i) => h('button', {
    class: 'state' + (i === cur ? ' current' : i < cur ? ' reached' : ''), onclick: ev => confirmState(id, s, ev.currentTarget),
  }, de(s), i <= cur ? h('span', {}, '✓') : null)) : [h('p', { class: 'empty' }, 'Keine Zustände definiert.')]));
  $('sheetBg').style.display = 'block';
  requestAnimationFrame(() => $('sheet').classList.add('open'));
}
function closeSheet() { $('sheet').classList.remove('open'); $('sheetBg').style.display = 'none'; }
$('sheetBg').onclick = closeSheet;
$('sheetClose').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

async function confirmState(id, state, btn) {
  document.querySelectorAll('.state').forEach(b => b.disabled = true);
  try {
    const r = await fetch(`/api/elements/${encodeURIComponent(id)}/confirm`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state }) });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
    const name = elements[id]?.name || id;
    toast(body.action === 'confirmed' ? `✓ ${name}: ${de(body.state)} bestätigt`
        : body.action === 'unchanged' ? `${name}: unverändert, bereits ${de(body.state)}` : `${name}: ${body.action}`);
    closeSheet();
    await load();
  } catch (e) {
    toast(`Fehler: ${e.message}`, true);
    document.querySelectorAll('.state').forEach(b => b.disabled = false);
  }
}

$('release').onclick = () => toast('Tagesbericht freigegeben. Daily report released.');

async function load() {
  try {
    const r = await fetch('/api/overview', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    render(await r.json());
  } catch (e) {
    $('acts').replaceChildren(h('p', { class: 'empty' }, `Daten konnten nicht geladen werden (${e.message}).`));
  }
}
load();

let refreshTimer = null, backoff = 1000;
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/events`);
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'update' || (m.type === 'status' && m.props && m.props.step === 'done')) {
      clearTimeout(refreshTimer); refreshTimer = setTimeout(load, 600);
    }
  };
  ws.onopen = () => { backoff = 1000; };
  ws.onclose = () => { setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 15000); };
}
connect();
</script>
</body>
</html>
