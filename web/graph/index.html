<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tagwerk · Live-Graph</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --ink: #e6edf3; --muted: #8b949e;
          --blue: #388bfd; --green: #3fb950; --amber: #d29922; --red: #f85149; --purple: #a371f7; --strip: 128px; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); overflow: hidden; }
  #bar { height: 56px; padding: 0 20px; display: flex; gap: 20px; align-items: center; border-bottom: 1px solid #21262d; box-sizing: border-box; }
  #bar b { font-size: 20px; letter-spacing: .3px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); display: inline-block; margin-right: 6px; }
  #srv { font-size: 14px; color: var(--muted); white-space: nowrap; }
  #steps { display: flex; gap: 6px; flex: 1; justify-content: center; }
  #steps span { font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; transition: all .3s; }
  #steps span.done { color: var(--ink); border-color: #2ea04366; background: #2ea04322; }
  #steps span.active { color: #fff; border-color: var(--blue); background: #1f6feb; box-shadow: 0 0 14px #388bfd88; }
  #steps .cid { border: 0; padding-left: 0; color: var(--muted); }
  #legend { display: flex; gap: 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  #legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  label { font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  a { color: #58a6ff; font-size: 14px; text-decoration: none; white-space: nowrap; }
  #heads { position: absolute; top: 56px; left: 0; right: 0; height: 30px; pointer-events: none; }
  #heads div { position: absolute; transform: translateX(-50%); font-size: 13px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); white-space: nowrap; top: 8px; }
  #net { position: absolute; top: 86px; bottom: var(--strip); left: 0; right: 0; }
  #strip { position: absolute; left: 0; right: 0; bottom: 0; height: var(--strip); box-sizing: border-box; border-top: 1px solid #21262d;
           background: var(--panel); padding: 14px 24px; display: flex; gap: 24px; align-items: center; }
  #strip .k { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; }
  #say { flex: 1; min-width: 0; }
  #saytext { font-size: 26px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #saytext.idle { color: var(--muted); font-size: 20px; }
  #saytext mark { border-radius: 4px; padding: 0 3px; color: #0d1117; transition: background .4s; }
  #saytext mark.c { background: var(--green); } #saytext mark.p { background: var(--amber); } #saytext mark.e { background: var(--red); color: #fff; }
  #seen { width: 420px; flex: none; }
  #seentext { font-size: 17px; color: var(--ink); line-height: 1.4; }
  #seentext .m { color: var(--muted); }
  #toast { position: absolute; top: 100px; right: 24px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  #toast div { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 8px; padding: 10px 14px; font-size: 17px;
               box-shadow: 0 6px 24px #0008; animation: in .3s ease-out; }
  #toast div.p { border-left-color: var(--amber); } #toast div.e { border-left-color: var(--red); }
  @keyframes in { from { opacity: 0; transform: translateY(-8px); } }
</style>
</head>
<body>
<div id="bar">
  <b>Tagwerk</b>
  <span id="srv"><span id="dot"></span>Live</span>
  <div id="steps"></div>
  <span id="legend">
    <span><i style="background:#6e7681"></i>0 %</span>
    <span><i style="background:hsl(38,75%,50%)"></i>in Arbeit</span>
    <span><i style="background:#2ea043"></i>fertig</span>
    <span><i style="background:var(--purple);box-shadow:0 0 0 2px var(--red)"></i>verspätet</span>
    <span><i style="background:#1f6feb"></i>Aufnahme</span>
  </span>
  <label><input type="checkbox" id="details"> Details</label>
  <a href="/dashboard">Dashboard →</a>
</div>
<div id="heads"></div>
<div id="net"></div>
<div id="toast"></div>
<div id="strip">
  <div id="say"><div class="k" id="sayhead">Gesprochen</div><div id="saytext" class="idle">Warte auf die nächste Aufnahme…</div></div>
  <div id="seen"><div class="k">Erkannt</div><div id="seentext"><span class="m">–</span></div></div>
</div>
<script>
// ---------------------------------------------------------------- model
const MAIN = new Set(['BoQPosition', 'Activity', 'Element', 'Zone', 'Capture', 'Event', 'Proposal']);
const SHOW_EDGES = new Set(['SCHEDULED_AS', 'BUILDS', 'CONTAINS_ELEMENT', 'IN_ZONE', 'CONFIRMED', 'PROPOSES', 'FOR', 'RAISED', 'AFFECTS']);
const COLS = [  // world x of each column centre, box width, heading
  { label: 'BoQPosition', x: 140, w: 250, head: 'GAEB-Position' },
  { label: 'Activity', x: 540, w: 250, head: 'P6-Vorgang' },
  { label: 'Element', x: 930, w: 250, head: 'Bauteil' },
  { label: 'Zone', x: 1270, w: 170, head: 'Zone' },
  { label: 'Capture', x: 1530, w: 190, head: 'Aufnahme heute' },
  { label: 'Event', x: 1790, w: 230, head: 'Ereignis / Vorschlag' },
];
// large projects (> LARGE_AT elements): WBS -> activity -> one aggregate per (activity, storey) -> touched/opened elements
const LCOLS = [
  { label: 'WBS', x: 110, w: 190, head: 'Abschnitt (WBS)' },
  { label: 'Activity', x: 420, w: 270, head: 'P6-Vorgang' },
  { label: 'Aggregate', x: 760, w: 250, head: 'Vorgang × Geschoss' },
  { label: 'Element', x: 1090, w: 250, head: 'Bauteil (heute / geöffnet)' },
  { label: 'Zone', x: 1375, w: 190, head: 'Geschoss' },
  { label: 'Capture', x: 1610, w: 180, head: 'Aufnahme heute' },
  { label: 'Event', x: 1815, w: 200, head: 'Ereignis / Vorschlag' },
];
const colMap = cols => { const m = Object.fromEntries(cols.map(c => [c.label, c])); m.Proposal = m.Event; m.More = m.Element; return m; };
const LARGE_AT = 150, AGG_CAP = 60;
const INSTALLED = new Set(['installed', 'checked', 'done', 'finished', 'tested', 'commissioned']);
let LARGE = false, CUR_COLS = COLS, COL = colMap(COLS);
const BASE_H = 860;
let HEIGHT = BASE_H;           // world units the tallest column spreads over (grows for big expanded views)
const MAX_CAPTURES = 6;        // newest captures of today on screen
const STATE_DE = { removed: 'demontiert', substructure: 'Unterkonstruktion', installed: 'montiert', checked: 'abgenommen',
  prepared: 'vorbereitet', primed: 'grundiert', painted: 'gestrichen', done: 'fertig', framed: 'Rahmen', boarded: 'beplankt',
  finished: 'fertig', mounted: 'montiert', wired: 'verkabelt', tested: 'geprüft', connected: 'angeschlossen',
  commissioned: 'in Betrieb', stripped: 'entfernt', levelled: 'nivelliert', covered: 'belegt' };
const de = s => STATE_DE[s] || s || 'nicht begonnen';
const EV_ICON = { absence: '🤒', delay: '⏱', defect: '⚠', weather: '🌧', delivery: '🚚', accident: '⛑' };

let all = { nodes: new Map(), edges: new Map() };
let TODAY = null, live = false, flashes = new Map();
const nodes = new vis.DataSet(), edges = new vis.DataSet();
const net = new vis.Network(document.getElementById('net'), { nodes, edges }, {
  nodes: { shape: 'box', margin: { top: 6, bottom: 6, left: 10, right: 10 }, borderWidth: 0, shapeProperties: { borderRadius: 6 },
           font: { face: 'system-ui, -apple-system, Segoe UI, sans-serif', size: 15, color: '#e6edf3', multi: 'html' } },
  edges: { arrows: { to: { enabled: false } }, color: { color: '#3b434d', highlight: '#c9d1d9', hover: '#8b949e' }, width: 1,
           smooth: { type: 'cubicBezier', forceDirection: 'horizontal', roundness: 0.5 }, selectionWidth: 2 },
  physics: false,
  interaction: { hover: true, tooltipDelay: 120, dragNodes: false, zoomView: true },
});

function pctColor(p) {
  if (!p) return '#6e7681';
  if (p >= 100) return '#2ea043';
  return `hsl(${38 + 50 * p / 100}, 75%, ${50 - 6 * p / 100}%)`;  // amber -> lime
}
function hslToRgb(c) {  // vis needs a parseable colour for tweening: accept #hex, rgb(), hsl()
  const el = document.createElement('i'); el.style.color = c; document.body.append(el);
  const out = getComputedStyle(el).color.match(/\d+/g).slice(0, 3).map(Number); el.remove(); return out;
}
const mix = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
const clip = (s, n) => !s ? '' : s.length > n ? s.slice(0, n - 1) + '…' : s;
const capTime = p => (p.ts || '').slice(11, 16) || (p.name || '').slice(-5);

function nodeLabel(n) {
  const p = n.props || {};
  const f = flashes.get(n.id);
  switch (n.label) {
    case 'Element': return `<b>${clip(p.name_de || p.name || n.id, LARGE ? 21 : 20)}</b>  ${f ? `${f.from} → ${p.pct ?? 0}\u00a0%` : (p.pct ?? 0) + '\u00a0%'}`;
    case 'Activity': {
      const late = p.delay_d > 0 ? `  ·  <b>+${p.delay_d} AT</b>` : '';
      if (p.tracked === false) return `<b>${clip(p.name || n.id, LARGE ? 27 : 24)}</b>\nnicht verfolgt`;
      return `<b>${clip(p.name || n.id, LARGE ? 27 : 24)}</b>\n${(+(p.pct ?? 0)).toFixed(0)} %${late}`;
    }
    case 'WBS': return `<b>${wbsOpen.has(n.id) ? '▾' : '▸'} ${clip(p.name || p.code || n.id, 18)}</b>\n${p.shown}/${p.total} Vorgänge`;
    case 'Aggregate': return `<b>${aggOpen.has(n.id) ? '▾' : '▸'} ${clip(p.zoneName, 20)}</b>\n${p.n}/${p.m} montiert · ${p.pct.toFixed(0)} %`;
    case 'More': return `+${p.k} weitere…`;
    case '_': {
    }
    case 'BoQPosition': return `<b>${n.id}</b>\n${clip(p.short_text || '', 25)}`;
    case 'Capture': return `<b>Aufnahme ${capTime(p)}</b>`;
    case 'Zone': return `<b>${p.name || n.id}</b>`;
    case 'Event': return `${EV_ICON[p.type] || '•'} ${clip(p.text || p.name || n.id, 22)}`;
    case 'Proposal': return `Vorschlag: <b>${de(p.state)}</b>?`;
  }
  return clip(p.name_de || p.name || p.label || p.text || n.id, 30);
}
function nodeStyle(n) {
  const p = n.props || {};
  let bg = '#30363d', fg = '#e6edf3', border = bg, bw = 0, dashes = false;
  switch (n.label) {
    case 'BoQPosition': bg = '#3d2e0f'; border = '#d29922'; bw = 1; fg = '#f2cc60'; break;
    case 'Activity': bg = '#3b2a63'; border = p.delay_d > 0 ? '#f85149' : '#a371f7'; bw = p.delay_d > 0 ? 3 : 1;
      if (p.tracked === false) { bg = '#2d333b'; border = '#484f58'; bw = 1; fg = '#8b949e'; } break;
    case 'WBS': bg = '#1c2a3a'; border = '#58a6ff'; bw = 1; break;
    case 'Aggregate': bg = pctColor(p.pct); fg = p.pct ? '#0d1117' : '#e6edf3'; border = aggOpen.has(n.id) ? '#fff' : bg; bw = aggOpen.has(n.id) ? 2 : 0; break;
    case 'More': bg = '#21262d'; border = '#6e7681'; bw = 1; fg = '#c9d1d9'; dashes = true; break;
    case 'Element': bg = pctColor(p.pct); fg = p.pct ? '#0d1117' : '#e6edf3'; border = bg; break;
    case 'Zone': bg = '#12361f'; border = '#3fb950'; bw = 1; break;
    case 'Capture': bg = '#1f6feb'; border = '#79c0ff'; bw = 1; fg = '#fff'; break;
    case 'Event': bg = '#3d1214'; border = '#f85149'; bw = 1; fg = '#ffdcd7'; break;
    case 'Proposal': bg = '#2b2111'; border = '#d29922'; bw = 2; fg = '#f2cc60'; dashes = true; break;
  }
  return { bg, fg, border, bw, dashes };
}
function tooltip(n) {
  const p = n.props || {};
  const el = document.createElement('div');
  el.style.cssText = 'font:13px system-ui;max-width:360px;white-space:pre-wrap';
  const rows = Object.entries(p).filter(([k, v]) => v !== null && v !== '' && typeof v !== 'object' && !['id', 'global_id', 'zone', 'act'].includes(k));
  el.textContent = `${n.label} ${n.id}\n` + rows.map(([k, v]) => `${k}: ${k === 'state' ? de(v) : v}`).join('\n');
  return el;
}
function visNode(n, pos) {
  const s = nodeStyle(n), col = COL[n.label];
  const out = { id: n.id, label: nodeLabel(n), title: tooltip(n),
    color: { background: s.bg, border: s.border, highlight: { background: s.bg, border: '#fff' }, hover: { background: s.bg, border: '#c9d1d9' } },
    borderWidth: s.bw, borderWidthSelected: s.bw + 2, shapeProperties: { borderRadius: 6, borderDashes: s.dashes ? [6, 4] : false },
    font: { color: s.fg, size: n.label === 'Element' ? 14 : 15 }, shadow: { enabled: false } };
  if (col && !details()) out.widthConstraint = { minimum: col.w, maximum: col.w };
  if (n.label === 'Element') out.margin = { top: 4, bottom: 4, left: 10, right: 10 };
  if (pos) { out.x = pos.x; out.y = pos.y; }
  return out;
}

// ---------------------------------------------------------------- visibility
const details = () => document.getElementById('details').checked;
function todaysCaptures() {
  return [...all.nodes.values()].filter(n => n.label === 'Capture' && (!n.props.date || !TODAY || n.props.date === TODAY))
    .sort((a, b) => (a.props.ts || a._seen || '').localeCompare(b.props.ts || b._seen || '')).slice(-MAX_CAPTURES);
}
let shownCaps = new Set();
function captureOf(n) { return n.props.capture || n.props.capture_id || n.id.split(':')[0]; }
function visible(n) {
  if (LARGE) return !!(LV && LV.nodes.has(n.id));
  if (details()) return true;
  if (!MAIN.has(n.label)) return false;
  if (n.label === 'Capture') return shownCaps.has(n.id);
  if (n.label === 'Event') return shownCaps.has(captureOf(n)) && !duplicateEvent(n);
  if (n.label === 'Proposal') return shownCaps.has(captureOf(n));
  return true;
}
function duplicateEvent(n) {
  const t = n.props.text || n.props.name || '', cap = captureOf(n);
  for (const o of all.nodes.values())
    if (o !== n && o.label === 'Event' && captureOf(o) === cap) {
      const u = o.props.text || o.props.name || '';
      if (u && u.length < t.length && t.startsWith(u)) return true;
    }
  return false;
}
function edgeVisible(e) {
  const a = all.nodes.get(e.src), b = all.nodes.get(e.dst);
  if (!a || !b || !visible(a) || !visible(b)) return false;
  return details() || SHOW_EDGES.has(e.rel);
}

// ---------------------------------------------------------------- layout: one column per label, ordered to limit crossings
let POS = new Map();
function spread(ids, x, top = 0, height = HEIGHT) {
  const step = ids.length ? height / ids.length : 0;
  ids.forEach((id, i) => POS.set(id, { x, y: top + step * (i + 0.5) }));
}
function layout() {
  POS = new Map(); HEIGHT = BASE_H;
  const byLabel = l => [...all.nodes.values()].filter(n => n.label === l && visible(n));
  const out = (src, rel) => [...all.edges.values()].filter(e => e.src === src && e.rel === rel).map(e => e.dst);
  const acts = byLabel('Activity').sort((a, b) => a.id.localeCompare(b.id));
  const actIdx = new Map(acts.map((a, i) => [a.id, i]));
  const elFirst = new Map();
  acts.forEach((a, i) => out(a.id, 'BUILDS').forEach(el => { if (!elFirst.has(el)) elFirst.set(el, i); }));
  const els = byLabel('Element').sort((a, b) => (elFirst.get(a.id) ?? 99) - (elFirst.get(b.id) ?? 99)
    || (a.props.zone || '').localeCompare(b.props.zone || '') || (a.props.name_de || a.id).localeCompare(b.props.name_de || b.id));
  spread(els.map(n => n.id), COL.Element.x);
  // activities: barycentre of their elements, then evenly re-spaced in that order
  const yOf = id => POS.get(id)?.y;
  const bary = (ids, fallback) => { const ys = ids.map(yOf).filter(v => v != null); return ys.length ? ys.reduce((s, v) => s + v, 0) / ys.length : fallback; };
  const actsSorted = acts.map((a, i) => [a.id, bary(out(a.id, 'BUILDS'), i * HEIGHT / acts.length)]).sort((p, q) => p[1] - q[1]).map(p => p[0]);
  spread(actsSorted, COL.Activity.x);
  const boqs = byLabel('BoQPosition').map(b => [b.id, bary(out(b.id, 'SCHEDULED_AS'), bary(out(b.id, 'QUANTIFIES'), HEIGHT))])
    .sort((p, q) => p[1] - q[1] || p[0].localeCompare(q[0])).map(p => p[0]);
  spread(boqs, COL.BoQPosition.x);
  // zones at the barycentre of their elements, pushed apart
  const zones = byLabel('Zone').map(z => ({ id: z.id, y: bary(out(z.id, 'CONTAINS_ELEMENT'), HEIGHT) })).sort((a, b) => a.y - b.y);
  separate(zones, 70); zones.forEach(z => POS.set(z.id, { x: COL.Zone.x, y: z.y }));
  // today's captures next to their zone; events and proposals beside their capture
  const caps = todaysCaptures().filter(visible).map(c => ({ id: c.id, y: yOf(c.props.zone_id || out(c.id, 'IN_ZONE')[0]) ?? HEIGHT / 2 }));
  caps.sort((a, b) => a.y - b.y); separate(caps, 62); caps.forEach(c => POS.set(c.id, { x: COL.Capture.x, y: c.y }));
  const side = [];
  caps.forEach(c => {
    const kids = [...all.nodes.values()].filter(n => (n.label === 'Event' || n.label === 'Proposal') && visible(n) && captureOf(n) === c.id);
    kids.forEach((k, i) => side.push({ id: k.id, y: c.y + (i - (kids.length - 1) / 2) * 52 }));
  });
  side.sort((a, b) => a.y - b.y); separate(side, 50); side.forEach(s => POS.set(s.id, { x: COL.Event.x, y: s.y }));
}
function separate(items, gap) {  // keep order, enforce a minimum gap, stay inside [0, HEIGHT]
  for (let i = 1; i < items.length; i++) items[i].y = Math.max(items[i].y, items[i - 1].y + gap);
  const over = items.length ? items[items.length - 1].y - (HEIGHT - gap / 2) : 0;
  if (over > 0) items.forEach(it => it.y -= over);
  for (let i = items.length - 2; i >= 0; i--) items[i].y = Math.min(items[i].y, items[i + 1].y - gap);
  if (items.length && items[0].y < gap / 2) { const d = gap / 2 - items[0].y; items.forEach(it => it.y += d); }
}

// ---------------------------------------------------------------- large projects
let LV = null, aggOpen = new Set(), wbsOpen = new Set(), moreCap = {}, fxQueue = [], largeTimer = null;
function scheduleLarge() {
  clearTimeout(largeTimer);
  largeTimer = setTimeout(() => { largeTimer = null; redrawLarge(false); const q = fxQueue; fxQueue = []; q.forEach(f => f()); }, 120);
}
function buildLarge() {
  shownCaps = new Set(todaysCaptures().map(c => c.id));
  const builds = new Map(), wbsOf = new Map(), V = new Map(), VE = [];
  all.edges.forEach(e => {
    if (e.rel === 'BUILDS') (builds.get(e.src) || builds.set(e.src, []).get(e.src)).push(e.dst);
    else if (e.rel === 'IN_WBS' && all.nodes.get(e.src)?.label === 'Activity') wbsOf.set(e.src, e.dst);
  });
  const touched = new Set();
  all.edges.forEach(e => { if (e.rel === 'CONFIRMED' && shownCaps.has(e.src)) touched.add(e.dst); });
  all.nodes.forEach(n => { if (n.label === 'Proposal' && shownCaps.has(captureOf(n)) && n.props.element) touched.add(n.props.element); });
  const zoneOrder = [...all.nodes.values()].filter(n => n.label === 'Zone').map(n => n.id);
  const acts = [...all.nodes.values()].filter(n => n.label === 'Activity').sort((a, b) =>
    (wbsOf.get(a.id) || '').localeCompare(wbsOf.get(b.id) || '') || (a.props.planned_start || '').localeCompare(b.props.planned_start || '') || a.id.localeCompare(b.id));
  const focus = a => { const p = a.props, pct = p.pct || 0, fin = p.forecast_finish || p.planned_finish || '';
    return (pct > 0 && pct < 100) || (TODAY && (p.planned_start || '9') <= TODAY && TODAY <= fin); };
  const shownActs = acts.filter(a => focus(a) || wbsOpen.has(wbsOf.get(a.id)) || (builds.get(a.id) || []).some(el => touched.has(el)));
  const add = n => V.set(n.id, n);
  [...all.nodes.values()].filter(n => n.label === 'WBS').sort((a, b) => (a.props.code || a.id).localeCompare(b.props.code || b.id)).forEach(w => {
    const total = acts.filter(a => wbsOf.get(a.id) === w.id).length;
    if (total) add({ ...w, props: { ...w.props, total, shown: shownActs.filter(a => wbsOf.get(a.id) === w.id).length } });
  });
  const elShown = new Set(touched), memberEdges = [];
  shownActs.forEach(a => {
    add(a);
    if (wbsOf.has(a.id) && V.has(wbsOf.get(a.id))) VE.push({ src: wbsOf.get(a.id), rel: 'IN_WBS', dst: a.id });
    const byZone = new Map();
    (builds.get(a.id) || []).forEach(el => { const z = all.nodes.get(el)?.props.zone; if (z) (byZone.get(z) || byZone.set(z, []).get(z)).push(el); });
    [...byZone.keys()].sort((x, y) => zoneOrder.indexOf(x) - zoneOrder.indexOf(y)).forEach(z => {
      const members = byZone.get(z), id = `agg:${a.id}:${z}`;
      const els = members.map(m => all.nodes.get(m).props);
      add({ id, label: 'Aggregate', props: { act: a.id, zone: z, zoneName: all.nodes.get(z)?.props.name || z, members, m: members.length,
        n: els.filter(e => INSTALLED.has(e.state) || (e.pct || 0) >= 100).length, pct: els.reduce((s, e) => s + (e.pct || 0), 0) / members.length } });
      VE.push({ src: a.id, rel: 'HAS_AGG', dst: id }, { src: id, rel: 'AGG_ZONE', dst: z });
      if (aggOpen.has(id)) {
        const cap = moreCap[id] || AGG_CAP;
        members.slice(0, cap).forEach(m => elShown.add(m));
        if (members.length > cap) { add({ id: `more:${id}`, label: 'More', props: { agg: id, k: members.length - cap } }); VE.push({ src: id, rel: 'MEMBER', dst: `more:${id}` }); }
      }
      members.forEach(m => memberEdges.push([id, m]));
    });
  });
  elShown.forEach(id => { const n = all.nodes.get(id); if (n) add(n); });
  memberEdges.forEach(([a, m]) => { if (elShown.has(m)) VE.push({ src: a, rel: 'MEMBER', dst: m }); });
  all.nodes.forEach(n => {
    if (n.label === 'Zone') add(n);
    else if (n.label === 'Capture' && shownCaps.has(n.id)) add(n);
    else if (n.label === 'Proposal' && shownCaps.has(captureOf(n))) add(n);
    else if (n.label === 'Event' && shownCaps.has(captureOf(n))) add(n);
  });
  LV = { nodes: V, edges: VE };
  [...V.values()].filter(n => n.label === 'Event' && duplicateEvent(n)).forEach(n => V.delete(n.id));
  all.edges.forEach(e => {
    if (['CONFIRMED', 'PROPOSES', 'FOR', 'IN_ZONE', 'RAISED', 'AFFECTS'].includes(e.rel) && V.has(e.src) && V.has(e.dst)) VE.push(e);
  });
  return { shownActs, elShown };
}
function layoutLarge() {
  POS = new Map();
  const V = LV.nodes, of = l => [...V.values()].filter(n => n.label === l);
  const acts = of('Activity'), aggs = of('Aggregate'), els = of('Element').concat(of('More'));
  HEIGHT = Math.max(BASE_H, acts.length * 50, aggs.length * 46, els.length * 26);
  spread(aggs.map(n => n.id), COL.Aggregate.x);
  const yOf = id => POS.get(id)?.y;
  const bary = (ids, fb) => { const ys = ids.map(yOf).filter(v => v != null); return ys.length ? ys.reduce((s, v) => s + v, 0) / ys.length : fb; };
  const outs = new Map(); LV.edges.forEach(e => (outs.get(e.src) || outs.set(e.src, []).get(e.src)).push(e));
  const kids = (id, rel) => (outs.get(id) || []).filter(e => e.rel === rel).map(e => e.dst);
  const actItems = acts.map(a => ({ id: a.id, y: bary(kids(a.id, 'HAS_AGG'), HEIGHT / 2) }));
  separate(actItems, 50); actItems.forEach(a => POS.set(a.id, { x: COL.Activity.x, y: a.y }));
  const wbs = of('WBS').map((w, i) => ({ id: w.id, y: bary(kids(w.id, 'IN_WBS'), -1) }));
  let tail = 0; wbs.forEach(w => { if (w.y < 0) w.y = HEIGHT + 100 * tail++; });  // collapsed sections go to the bottom
  wbs.sort((a, b) => a.y - b.y); separate(wbs, 62); wbs.forEach(w => POS.set(w.id, { x: COL.WBS.x, y: w.y }));
  const firstAgg = new Map(); LV.edges.forEach(e => { if (e.rel === 'MEMBER' && !firstAgg.has(e.dst)) firstAgg.set(e.dst, yOf(e.src)); });
  const elItems = els.map(n => ({ id: n.id, y: firstAgg.get(n.id) ?? HEIGHT })).sort((a, b) => a.y - b.y);
  if (elItems.length * 26 >= HEIGHT - 26) spread(elItems.map(e => e.id), COL.Element.x);
  else { separate(elItems, 26); elItems.forEach(e => POS.set(e.id, { x: COL.Element.x, y: e.y })); }
  const zones = of('Zone').map(z => ({ id: z.id, y: bary(aggs.filter(a => a.props.zone === z.id).map(a => a.id), -1) }));
  zones.forEach((z, i) => { if (z.y < 0) z.y = HEIGHT; });
  zones.sort((a, b) => a.y - b.y); separate(zones, 56); zones.forEach(z => POS.set(z.id, { x: COL.Zone.x, y: z.y }));
  const caps = of('Capture').map(c => ({ id: c.id, y: yOf(c.props.zone_id || (outs.get(c.id) || []).find(e => e.rel === 'IN_ZONE')?.dst) ?? HEIGHT / 2 }));
  caps.sort((a, b) => a.y - b.y); separate(caps, 62); caps.forEach(c => POS.set(c.id, { x: COL.Capture.x, y: c.y }));
  const side = [];
  caps.forEach(c => {
    const ks = [...V.values()].filter(n => (n.label === 'Event' || n.label === 'Proposal') && captureOf(n) === c.id);
    ks.forEach((k, i) => side.push({ id: k.id, y: c.y + (i - (ks.length - 1) / 2) * 52 }));
  });
  side.sort((a, b) => a.y - b.y); separate(side, 50); side.forEach(s => POS.set(s.id, { x: COL.Event.x, y: s.y }));
}
function redrawLarge(fit) {
  buildLarge(); layoutLarge();
  nodes.clear(); edges.clear();
  nodes.add([...LV.nodes.values()].map(n => visNode(n, POS.get(n.id))));
  edges.add(LV.edges.map(e => visEdge(e.src + '|' + e.rel + '|' + e.dst, e)));
  if (latestCap && nodes.get(latestCap)) nodes.update({ id: latestCap, shadow: { enabled: true, color: '#79c0ff', size: 18, x: 0, y: 0 } });
  heads();
  if (fit) fitAll(false);
}
net.on('click', p => {
  if (!LARGE || !p.nodes.length || !LV) return;
  const id = p.nodes[0], n = LV.nodes.get(id); if (!n) return;
  if (n.label === 'Aggregate') { aggOpen.has(id) ? aggOpen.delete(id) : aggOpen.add(id); }
  else if (n.label === 'More') { moreCap[n.props.agg] = (moreCap[n.props.agg] || AGG_CAP) + AGG_CAP; }
  else if (n.label === 'WBS') { wbsOpen.has(id) ? wbsOpen.delete(id) : wbsOpen.add(id); }
  else return;
  redrawLarge(false); fitAll(true);
});
net.on('hoverNode', p => { const n = LV && LARGE && LV.nodes.get(p.node); document.getElementById('net').style.cursor = n && ['Aggregate', 'More', 'WBS'].includes(n.label) ? 'pointer' : ''; });
net.on('blurNode', () => { document.getElementById('net').style.cursor = ''; });

// ---------------------------------------------------------------- drawing
function applyLayoutMode() {
  net.setOptions(details()
    ? { layout: { hierarchical: { direction: 'LR', levelSeparation: 300, nodeSpacing: 40, sortMethod: 'directed' } } }
    : { layout: { hierarchical: { enabled: false } } });
}
function redraw(fit = true) {
  if (LARGE) return redrawLarge(fit);
  shownCaps = new Set(todaysCaptures().map(c => c.id));
  layout();
  nodes.clear(); edges.clear();
  const vn = []; all.nodes.forEach(n => { if (visible(n)) vn.push(visNode(n, details() ? null : POS.get(n.id))); });
  nodes.add(vn);
  const ve = []; all.edges.forEach((e, id) => { if (edgeVisible(e)) ve.push(visEdge(id, e)); });
  edges.add(ve);
  heads();
  if (fit) fitAll(false);
}
function relayout() {  // new capture/event: re-place without rebuilding everything
  if (LARGE) return scheduleLarge();
  const before = new Set(shownCaps);
  shownCaps = new Set(todaysCaptures().map(c => c.id));
  if ([...before].some(id => !shownCaps.has(id))) return redraw(false);
  layout();
  all.nodes.forEach(n => {
    if (!visible(n)) return;
    const p = details() ? null : POS.get(n.id);
    if (!nodes.get(n.id)) nodes.add(visNode(n, p)); else if (p) nodes.update({ id: n.id, x: p.x, y: p.y });
  });
  all.edges.forEach((e, id) => { if (edgeVisible(e) && !edges.get(id)) edges.add(visEdge(id, e)); });
}
function visEdge(id, e) {
  const st = {
    CONFIRMED: { color: { color: '#3fb950', highlight: '#56d364' }, width: 3, arrows: { to: { enabled: true, scaleFactor: .6 } } },
    PROPOSES: { color: { color: '#d29922' }, width: 2, dashes: [6, 5] },
    FOR: { color: { color: '#d29922' }, width: 2, dashes: [6, 5], arrows: { to: { enabled: true, scaleFactor: .6 } } },
    RAISED: { color: { color: '#f8514999' }, width: 1.5 },
    AFFECTS: { color: { color: '#f85149aa' }, width: 1.5, dashes: [4, 4], arrows: { to: { enabled: true, scaleFactor: .5 } },
               smooth: { type: 'curvedCW', roundness: 0.15 } },
    IN_ZONE: { color: { color: '#388bfd88' }, width: 1.5 },
    CONTAINS_ELEMENT: { color: { color: '#3fb95033' } },
    IN_WBS: { color: { color: '#58a6ff55' }, width: 1.5 },
    HAS_AGG: { color: { color: '#a371f766' }, width: 1.5 },
    AGG_ZONE: { color: { color: '#3fb95040' } },
    MEMBER: { color: { color: '#8b949e44' } },
  }[e.rel] || {};
  return { id, from: e.src, to: e.dst, title: e.rel + (e.props && e.props.quote ? `\n„${e.props.quote}“` : ''), ...st };
}
function fitAll(animate) {
  if (details() && !LARGE) return net.fit({ animation: animate ? { duration: 500 } : false });
  // frame the fixed world box so the canvas never rescales as captures come and go
  const el = document.getElementById('net'), W = el.clientWidth, H = el.clientHeight;
  const scale = Math.min(W / 1930, H / (HEIGHT + 20));
  net.moveTo({ position: { x: 960, y: HEIGHT / 2 }, scale, animation: animate ? { duration: 500 } : false });
}
function heads() {
  const box = document.getElementById('heads');
  if (details() && !LARGE) return box.replaceChildren();
  box.replaceChildren(...CUR_COLS.map(c => { const d = document.createElement('div'); d.textContent = c.head; d.dataset.x = c.x; return d; }));
  placeHeads();
}
function placeHeads() {
  document.querySelectorAll('#heads div').forEach(d => { d.style.left = net.canvasToDOM({ x: +d.dataset.x, y: 0 }).x + 'px'; });
}
net.on('afterDrawing', placeHeads);
window.addEventListener('resize', () => { fitAll(false); });
document.getElementById('details').onchange = () => { applyLayoutMode(); redraw(); };

// ---------------------------------------------------------------- animation
function tween(ms, step, done) {
  const t0 = performance.now();
  const f = now => { const t = Math.min(1, (now - t0) / ms); step(t); if (t < 1) requestAnimationFrame(f); else done && done(); };
  requestAnimationFrame(f);
}
function pulse(id, color = '#79c0ff', ms = 2600) {
  if (LARGE && largeTimer) return void fxQueue.push(() => pulse(id, color, ms));
  if (!live || !nodes.get(id)) return;
  tween(ms, t => {
    const k = Math.sin(t * Math.PI * 4) * 0.5 + 0.5, fade = 1 - t;
    nodes.update({ id, shadow: { enabled: true, color, size: 10 + 40 * k * fade, x: 0, y: 0 }, borderWidth: 2 + 4 * k * fade });
  }, () => { const n = all.nodes.get(id); if (n && nodes.get(id)) nodes.update({ id, shadow: { enabled: n.label === 'Capture' && id === latestCap, color, size: 18, x: 0, y: 0 }, borderWidth: nodeStyle(n).bw }); });
}
function pulseEdge(id, base = 3) {
  if (LARGE && largeTimer) return void fxQueue.push(() => pulseEdge(id, base));
  if (!live || !edges.get(id)) return;
  tween(3000, t => { const k = Math.sin(t * Math.PI * 6) * 0.5 + 0.5; edges.update({ id, width: base + 7 * k * (1 - t) }); },
        () => edges.get(id) && edges.update({ id, width: base }));
}
function recolour(n, prevPct) {
  if (LARGE && largeTimer) return void fxQueue.push(() => recolour(n, prevPct));
  if (!nodes.get(n.id)) return;
  if (!live || prevPct === n.props.pct) return nodes.update(visNode(n));
  flashes.set(n.id, { from: prevPct ?? 0 });
  const a = hslToRgb(pctColor(prevPct)), b = hslToRgb(pctColor(n.props.pct)), s = nodeStyle(n);
  nodes.update({ ...visNode(n), color: { background: mix(a, b, 0), border: mix(a, b, 0) } });
  tween(1600, t => nodes.update({ id: n.id, color: { background: mix(a, b, t), border: mix(a, b, t) } }));
  pulse(n.id, b[1] > 150 ? '#56d364' : '#e3b341', 3200);
  setTimeout(() => { flashes.delete(n.id); const cur = all.nodes.get(n.id); if (cur && nodes.get(n.id)) nodes.update(visNode(cur)); }, 9000);
}
function toast(text, cls = '') {
  if (!live) return;
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  const box = document.getElementById('toast'); box.prepend(d);
  while (box.children.length > 5) box.lastChild.remove();
  setTimeout(() => d.remove(), 9000);
}

// ---------------------------------------------------------------- transcript strip and pipeline steps
const STEPS = [['normalized', 'Medien'], ['transcribed', 'Sprache'], ['vision', 'Bilder'], ['structured', 'Struktur'], ['done', 'Graph']];
let transcript = '', marks = [];
function steps(cid, step) {
  const box = document.getElementById('steps');
  if (!cid) return box.replaceChildren();
  const idx = STEPS.findIndex(s => s[0] === step);
  const pills = STEPS.map(([k, name], i) => { const s = document.createElement('span'); s.textContent = (i <= idx || step === 'done' ? '✓ ' : '') + name;
    s.className = step === 'done' || i <= idx ? 'done' : i === idx + 1 ? 'active' : ''; return s; });
  const c = document.createElement('span'); c.className = 'cid'; c.textContent = cid;
  box.replaceChildren(c, ...pills);
}
function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function renderSay() {
  const el = document.getElementById('saytext');
  if (!transcript) { el.className = 'idle'; el.textContent = 'Warte auf die nächste Aufnahme…'; return; }
  el.className = '';
  // mark every phrase we can find (case-insensitive), longest first, without overlaps
  const low = transcript.toLowerCase(), spans = [];
  [...marks].sort((a, b) => b.q.length - a.q.length).forEach(m => {
    const i = low.indexOf(m.q.toLowerCase());
    let j = i + m.q.length;
    if (i >= 0 && m.cls === 'e') { const end = transcript.slice(j).search(/[,.;!?]/); j = end < 0 ? transcript.length : j + end; }
    if (i >= 0 && !spans.some(s => i < s.j && j > s.i)) spans.push({ i, j, cls: m.cls });
  });
  spans.sort((a, b) => a.i - b.i);
  let html = '„', at = 0;
  spans.forEach(s => { html += esc(transcript.slice(at, s.i)) + `<mark class="${s.cls}">${esc(transcript.slice(s.i, s.j))}</mark>`; at = s.j; });
  el.innerHTML = html + esc(transcript.slice(at)) + '“';
}
function mark(q, cls) { if (q) { q = q.replace(/^manual:\s*/, '').trim(); if (q) { marks.push({ q, cls }); renderSay(); } } }

// ---------------------------------------------------------------- data
async function snapshot(fit = true) {
  const [g, dash] = await Promise.all([fetch('/api/graph').then(r => r.json()), fetch('/api/overview').then(r => r.json()).catch(() => null)]);
  all = { nodes: new Map(), edges: new Map() };
  g.nodes.forEach(n => all.nodes.set(n.id, n));
  g.edges.forEach(e => all.edges.set(e.src + '|' + e.rel + '|' + e.dst, e));
  (dash?.activities || []).forEach(a => { const n = all.nodes.get(a.id); if (n) Object.assign(n.props, { pct: a.pct, delay_d: a.delay_d, forecast_finish: a.forecast_finish, tracked: a.tracked }); });
  let nEl = 0; all.nodes.forEach(n => { if (n.label === 'Element') nEl++; });
  LARGE = nEl > LARGE_AT;
  CUR_COLS = LARGE ? LCOLS : COLS; COL = colMap(CUR_COLS);
  document.getElementById('details').parentNode.style.display = LARGE ? 'none' : '';
  latestCap = todaysCaptures().slice(-1)[0]?.id || null;
  redraw(fit);
  if (latestCap) nodes.update({ id: latestCap, shadow: { enabled: true, color: '#79c0ff', size: 18, x: 0, y: 0 } });
}
  window.tagwerkReady = window.tagwerkReady || performance.now();
let latestCap = null;
function putNode(n) {
  const prev = all.nodes.get(n.id);
  const merged = prev ? { ...prev, ...n, label: n.label || prev.label, props: { ...prev.props, ...n.props } } : { ...n, props: { ...n.props }, _seen: new Date().toISOString() };
  all.nodes.set(n.id, merged);
  return { merged, prev };
}
function putEdge(e) {
  const id = e.src + '|' + e.rel + '|' + e.dst;
  all.edges.set(id, e);
  if (LARGE) { scheduleLarge(); return id; }
  if (edgeVisible(e)) { if (edges.get(id)) edges.update(visEdge(id, e)); else edges.add(visEdge(id, e)); }
  return id;
}

function onEvent(ev) {
  const p = ev.props || {};
  if (ev.type === 'status') {
    steps(ev.id, p.step);
    if (p.step === 'normalized' && live) { transcript = ''; marks = []; renderSay(); document.getElementById('seentext').innerHTML = '<span class="m">…</span>'; }
    if (p.step === 'transcribed') { transcript = (p.text || '').trim(); marks = []; renderSay(); document.getElementById('sayhead').textContent = `Gesprochen · ${ev.id}`; }
    if (p.step === 'vision') {
      const det = Object.entries(p.detections || {}).filter(([k]) => k !== 'marker').sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => `${v}× ${k}`);
      const mk = (p.markers || []).length ? `Marker ${p.markers.join(', ')}` : '';
      document.getElementById('seentext').innerHTML = [mk, det.join(', ')].filter(Boolean).map(esc).join('<br>') || '<span class="m">keine Objekte</span>';
    }
    if (p.step === 'done' && live) setTimeout(() => fitAll(true), 400);
    return;
  }
  if (ev.type === 'node') {
    const { merged, prev } = putNode(ev);
    if (ev.label === 'Capture') {
      latestCap = ev.id;
      relayout();
      if (!prev) { pulse(ev.id, '#79c0ff', 4000); toast(`Neue Aufnahme ${capTime(merged.props)} · ${all.nodes.get(merged.props.zone_id)?.props.name || merged.props.zone_id || ''}`); }
    } else if (ev.label === 'Event') {
      if (p.capture) putEdge({ src: p.capture, rel: 'RAISED', dst: ev.id });
      if (p.activity_id) putEdge({ src: ev.id, rel: 'AFFECTS', dst: p.activity_id });
      all.nodes.forEach(o => { if (o.label === 'Event' && !visible(o) && nodes.get(o.id)) nodes.remove(o.id); });
      relayout();
      if (nodes.get(ev.id)) nodes.update(visNode(merged, POS.get(ev.id)));
      pulse(ev.id, '#f85149', 3200);
      if (!prev) { toast(`${EV_ICON[p.type] || '•'} ${p.name || p.text || ''}`, 'e'); mark((p.name || '').split(': ').slice(1).join(': ') || p.name, 'e'); }
    } else { relayout(); }
    return;
  }
  if (ev.type === 'edge') {
    if (ev.label === 'PROPOSES') {  // capture -> proposal -> element, like the stored graph
      const pid = `${p.src}:proposal:${p.dst}`;
      putNode({ type: 'node', label: 'Proposal', id: pid, props: { state: p.state, capture: p.src, element: p.dst } });
      const e1 = putEdge({ src: p.src, rel: 'PROPOSES', dst: pid }), e2 = putEdge({ src: pid, rel: 'FOR', dst: p.dst });
      relayout(); pulse(pid, '#e3b341'); pulseEdge(e2, 2);
      mark(p.quote, 'p');
      toast(`Vorschlag: ${all.nodes.get(p.dst)?.props.name_de || p.dst} → ${de(p.state)}?`, 'p');
    } else {
      const id = putEdge({ src: p.src, rel: ev.label, dst: p.dst, props: { quote: p.quote, toState: p.state } });
      if (ev.label === 'CONFIRMED') { pulseEdge(id); mark(p.quote, 'c'); }
    }
    return;
  }
  if (ev.type === 'update') {
    const prevPct = all.nodes.get(ev.id)?.props?.pct;
    const { merged } = putNode({ label: ev.label, id: ev.id, props: ev.props });
    if (ev.label === 'Element') {
      if (p.name && !merged.props.name_de) merged.props.name_de = p.name;
      if (LARGE) {
        scheduleLarge();
        fxQueue.push(() => LV && LV.nodes.forEach(a => a.label === 'Aggregate' && a.props.members.includes(ev.id) && pulse(a.id, '#56d364', 3000)));
      }
      recolour(merged, prevPct);
      if (live && p.via === 'CONFIRMED' && prevPct !== p.pct) toast(`✓ ${merged.props.name_de || ev.id}: ${de(p.state)} · ${prevPct ?? 0} → ${p.pct} %`);
    } else if (ev.label === 'Activity') {
      if (nodes.get(ev.id)) nodes.update(visNode(merged));
      pulse(ev.id, merged.props.delay_d > 0 ? '#f85149' : '#a371f7', 2600);
    }
  }
}

// late joiners get the whole event history replayed: apply that burst silently, animate only what arrives after it
let quiet = null, connectedOnce = false;
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/events');
  ws.onopen = async () => {
    document.getElementById('dot').style.background = '#3fb950';
    live = false; quiet = setTimeout(() => { live = true; }, 700);
    if (connectedOnce) await snapshot(false);
    connectedOnce = true;
  };
  ws.onclose = () => { document.getElementById('dot').style.background = '#f85149'; live = false; setTimeout(connect, 2000); };
  ws.onmessage = m => {
    if (!live) { clearTimeout(quiet); quiet = setTimeout(() => { live = true; }, 400); }
    let ev; try { ev = JSON.parse(m.data); } catch { return; }
    try { onEvent(ev); } catch (e) { console.error('event', ev, e); }
  };
}
applyLayoutMode();
fetch('/health').then(r => r.json()).then(h => { TODAY = h.data_date; }).catch(() => {})
  .then(() => snapshot()).then(connect);
</script>
