services:
  neo4j:
    image: neo4j:5
    ports:  # localhost only: the API talks bolt on 7687; the browser UI on 7474 is for local debugging
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - ./neo4j/data:/data
    restart: unless-stopped
