[project]
name = "tagwerk"
version = "0.1.0"
description = "Site capture to element-level construction graph"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "neo4j>=5.20",
  "anthropic>=0.40",
]

[project.optional-dependencies]
gpu = [
  "torch==2.14.*",
  "torchvision",
  "ultralytics",
  "faster-whisper",
  "opencv-contrib-python>=4.10",
]
seed = [
  "ifcopenshell",
  "mpxj",
  "pyGAEB",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tagwerk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the real GPU models (RUN_GPU_TESTS=1)"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905", "E702", "E731"]  # B008: FastAPI File()/Form() defaults; rest: compact vision code
